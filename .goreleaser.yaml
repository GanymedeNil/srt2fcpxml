version: 2

project_name: srt2fcpxml

builds:
  - id: srt2fcpxml
    main: ./cmd/srt2fcpxml
    binary: srt2fcpxml
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
  - id: fcpxml2srt
    main: ./cmd/fcpxml2srt
    binary: fcpxml2srt
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

# One macOS binary for both Apple silicon and Intel, per program.
universal_binaries:
  - id: srt2fcpxml
    ids: [srt2fcpxml]
    name_template: srt2fcpxml
    replace: true
  - id: fcpxml2srt
    ids: [fcpxml2srt]
    name_template: fcpxml2srt
    replace: true

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}universal{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Release notes list the commits since the previous tag. Filters match the first
# line of each commit message; merge commits only repeat the PR's own commits.
changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^Merge pull request '
      - '^Merge branch '
      - '^docs:'
      - '^test:'
